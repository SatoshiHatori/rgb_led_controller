; PlatformIO から WCH-LinkE で書き込む: pio run -t upload
; ボード定義の F_CPU (144MHz) は使わない。実クロックは src/main.c の clock_init で決まる (8MHz)。
[env:vsi]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH32V203K8T6
board_build.ldscript = link.ld
upload_protocol = wch-link
build_flags = -Os -Wall -Wextra -ffreestanding -nostartfiles -nostdlib
